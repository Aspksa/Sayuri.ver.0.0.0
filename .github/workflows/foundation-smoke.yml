name: Foundation Smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверка протокола обновлений
        shell: pwsh
        run: python scripts/validate_update_protocol.py

      - name: Статическая проверка PowerShell
        shell: pwsh
        run: python scripts/check_powershell.py

      - name: Компиляция Python
        shell: pwsh
        run: python -m compileall -q src scripts tests

      - name: Тесты
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m unittest discover -s tests -v

      - name: Диагностика
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          python -m sayuri_yukishiro.main --preflight

      - name: Синтаксис PowerShell-скриптов
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @("scripts/launcher.ps1", "scripts/tray.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "$script: ошибки разбора" -ForegroundColor Red
              $errors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            } else {
              Write-Host "$script: синтаксис корректен"
            }
          }
          if ($failed) { exit 1 }

      - name: Иконка воспроизводится из исходника
        shell: pwsh
        run: |
          $before = (Get-FileHash assets/sayuri.ico -Algorithm SHA256).Hash
          python scripts/make_icon.py
          $after = (Get-FileHash assets/sayuri.ico -Algorithm SHA256).Hash
          if ($before -ne $after) { throw "assets/sayuri.ico не совпадает с генератором" }
          Write-Host "иконка воспроизводима"

      - name: Иконка загружается как System.Drawing.Icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = New-Object System.Drawing.Icon ((Resolve-Path "assets/sayuri.ico").Path)
          try {
            if ($icon.Width -le 0) { throw "иконка пустая" }
            Write-Host "иконка загружена: $($icon.Width)x$($icon.Height)"
          } finally {
            $icon.Dispose()
          }

      - name: Запуск лаунчера в режиме проверки
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/launcher.ps1 -PreflightOnly

      - name: Лаунчер в ASCII-режиме
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/launcher.ps1 -PreflightOnly -Ascii

      - name: Машинный отчёт диагностики
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD "src"
          $report = python -m sayuri_yukishiro.main --preflight --format json | ConvertFrom-Json
          if ($report.fatal) { throw "диагностика сообщила о критических ошибках" }
          if (-not $report.checks) { throw "в отчёте нет проверок" }
          foreach ($check in $report.checks) {
            if ($check.kind -notin @("ok", "warn", "bad")) {
              throw "неизвестное состояние проверки: $($check.kind)"
            }
          }
          Write-Host "проверок в отчёте: $($report.summary.total)"

      - name: Запуск через BAT и проверка сайта
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "cmd.exe" `
            -ArgumentList '/c', '"Sayuri Yukishiro.bat" -NoBrowser -NoTray' `
            -PassThru -WindowStyle Hidden
          try {
            $endpointFile = "data/runtime/endpoint.json"
            $deadline = (Get-Date).AddSeconds(90)
            while (-not (Test-Path $endpointFile) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            if (-not (Test-Path $endpointFile)) { throw "endpoint.json не появился" }
            $endpoint = Get-Content $endpointFile -Raw | ConvertFrom-Json
            Write-Host "Адрес: $($endpoint.url)"

            $health = Invoke-RestMethod "$($endpoint.url)api/health" -TimeoutSec 20
            if ($health.status -ne "ok") { throw "health: $($health.status)" }
            $site = Invoke-WebRequest $endpoint.url -TimeoutSec 20
            if ($site.StatusCode -ne 200) { throw "сайт: $($site.StatusCode)" }
            Write-Host "Сайт и API отвечают"

            Invoke-RestMethod -Method Post "$($endpoint.url)api/shutdown" `
              -Headers @{ "X-Sayuri-Token" = $endpoint.token } -TimeoutSec 20 | Out-Null
            $proc.WaitForExit(30000) | Out-Null
            if (Test-Path $endpointFile) { throw "endpoint.json не удалён после остановки" }
            Write-Host "Мягкая остановка прошла, носитель очищен"
          } finally {
            if (-not $proc.HasExited) { $proc.Kill() }
          }

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверка протокола обновлений
        run: python scripts/validate_update_protocol.py

      - name: Статическая проверка PowerShell
        run: python scripts/check_powershell.py

      - name: Иконка воспроизводится из исходника
        run: |
          sha256sum assets/sayuri.ico > /tmp/icon.sha
          python scripts/make_icon.py
          sha256sum -c /tmp/icon.sha

      - name: Компиляция Python
        run: python -m compileall -q src scripts tests

      - name: Тесты
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Диагностика
        env:
          PYTHONPATH: src
        run: python -m sayuri_yukishiro.main --preflight

      - name: Диагностика в ASCII-режиме
        env:
          PYTHONPATH: src
          SAYURI_ASCII: "1"
        run: python -m sayuri_yukishiro.main --preflight

      - name: Машинный отчёт диагностики
        env:
          PYTHONPATH: src
        run: python -m sayuri_yukishiro.main --preflight --format json
